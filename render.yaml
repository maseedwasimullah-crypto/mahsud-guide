# Render Blueprint for MAHSUDo-guide.
#
# Two independent web services are defined. Remove the one you do not want.
#
#   1. mahsud-guide          — full-stack: FastAPI serving the built React SPA
#                              and the API from one process (Dockerfile.fullstack).
#                              This is the recommended production architecture.
#   2. mahsud-guide-streamlit — the Streamlit single-file assistant (Dockerfile).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Render generates SECRET_KEY automatically; set the AI provider key when
# prompted (or leave LLM_PROVIDER as "none" for extractive mode).
services:
  # ----------------------------------------------------------------------- #
  # Full-stack (FastAPI + React) — recommended.
  # ----------------------------------------------------------------------- #
  - type: web
    name: mahsud-guide
    runtime: docker
    dockerfilePath: ./Dockerfile.fullstack
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # For a persistent database, attach a Render PostgreSQL and set:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mahsud-db
      #     property: connectionString

  # ----------------------------------------------------------------------- #
  # Streamlit alternative (delete if not needed).
  # ----------------------------------------------------------------------- #
  - type: web
    name: mahsud-guide-streamlit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
